{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Carmen Cardena Boutique{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/palette.css' %}?v=20260616-warm-palette">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20260617-cms-simple-content">
  {% if active_color_palette %}
    <style id="active-color-palette">
      :root {
        {% for variable, value in active_color_palette.css_variable_items %}
          {{ variable }}: {{ value }};
        {% endfor %}
      }
    </style>
  {% endif %}
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/app.js' %}?v=20260617-cms-simple-content"></script>
</body>
</html>
